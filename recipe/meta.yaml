{% set name = "pyloadprofilegenerator" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyloadprofilegenerator-{{ version }}.tar.gz
  sha256: a735bdffd1060a33c8f43795116c32bca0e8c5a060a0bf8a65300f844a0cddf7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools-git
    - pip
    - setuptools
  run:
    - python >=3.6
    - setuptools
    - requests
    - dataclasses-json
    - pandas
    - numpy

test:
  imports:
    - pylpg
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/FZJ-IEK3-VSA/pylpg
  summary: Python Bindings for the LoadProfileGenerator
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - julian-belina
